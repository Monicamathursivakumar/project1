services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vaulttrace
      POSTGRES_USER: vaulttrace
      POSTGRES_PASSWORD: vaulttrace
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U vaulttrace -d vaulttrace"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports: ["5432:5432"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://vaulttrace:vaulttrace@db:5432/vaulttrace
      SECRET_KEY: change-this-in-production
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]
