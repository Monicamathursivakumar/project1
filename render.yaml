databases:
  - name: vaulttrace-db
    plan: free
    databaseName: vaulttrace
    user: vaulttrace
    postgresMajorVersion: "16"

services:
  - type: web
    name: vaulttrace-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vaulttrace-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PUBLIC_DEMO_MODE
        value: "true"
      - key: UPLOAD_DIR
        value: /tmp/private_uploads
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: vaulttrace-web
          property: url
      - key: FRONTEND_BASE_URL
        fromService:
          type: web
          name: vaulttrace-web
          property: url
      - key: APP_ENVIRONMENT
        value: demo

  - type: web
    name: vaulttrace-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: vaulttrace-api
          property: host
      - key: NODE_VERSION
        value: 24.22.1
      - key: VITE_PUBLIC_DEMO
        value: "true"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
