databases:
  - name: vaulttrace-db
    plan: basic-256mb
    databaseName: vaulttrace
    user: vaulttrace
    postgresMajorVersion: "16"

services:
  - type: web
    name: vaulttrace-api
    runtime: docker
    rootDir: backend
    plan: starter
    healthCheckPath: /health
    disk:
      name: vaulttrace-private-uploads
      mountPath: /var/data/private_uploads
      sizeGB: 10
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vaulttrace-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: UPLOAD_DIR
        value: /var/data/private_uploads
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: vaulttrace-web
          property: url
      - key: FRONTEND_BASE_URL
        fromService:
          type: web
          name: vaulttrace-web
          property: url
      - key: BOOTSTRAP_TOKEN
        generateValue: true
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        sync: false
      - key: APP_ENVIRONMENT
        value: production

  - type: web
    name: vaulttrace-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: vaulttrace-api
          property: host
      - key: NODE_VERSION
        value: 22.12.0
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
